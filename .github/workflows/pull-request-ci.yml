name: e-Moeslife Pull Request CI

on:
  pull_request:
    branches:
      - main
      - feat/android-update-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app and offline assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check service-worker.js
      - name: Run unit tests
        run: npm test
      - name: Prepare offline and Android web assets
        run: npm run prepare:mobile
      - name: Verify service-worker precache assets
        run: node scripts/validate-offline-assets.mjs
      - name: Verify required offline assets
        run: |
          test -f www/index.html
          test -f www/service-worker.js
          test -f www/src/app.js
          test -f www/src/features/prayer/prayer-times.js
          test -f www/src/features/reader/navigation.js
          test -f www/src/features/reader/page-state.js
          test -f www/src/features/reader/sections.js
          test -f www/src/features/reader/contents.js
          test -f www/src/features/reader/controller.js
          test -f www/src/features/reader/audio.js
          test -f www/src/features/reader/content-loader.js
          test -f www/src/features/reader/gestures.js
          test -f www/src/features/reader/appearance.js
          test -f www/src/features/reader/pagination.js
          test -f www/src/features/home/search.js
          test -f www/src/features/home/reading-list.js
          test -f www/src/features/collections/navigation.js
          test -f www/src/data/sections.js
          test -f www/src/data/dzikir-overrides.json
          test -f www/etahlil-pembagian-halaman-dzikir.json

  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run prepare:mobile
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: e-moeslife-pr-${{ github.event.pull_request.number || 'manual' }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
